name: Validate Geez Squad
# PR branches are validated once, by the pull_request event. master is validated on
# every push. Run manually from the Actions tab for any other branch.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a PR cancels that PR's superseded run. master runs always complete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Verified pose models are reused from this directory (actions/cache below) instead of being
# downloaded from Google storage on every build (scripts/prepare-assets.mjs).
env:
  POSE_MODEL_CACHE_DIR: .cache/pose-models
jobs:
  # Decide which heavy jobs a PR needs. master pushes and manual runs need all of them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      schema: ${{ steps.classify.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=false
          schema=false
          while IFS= read -r file; do
            case "$file" in
              ''|docs/*|*.md|.claude/*|.agents/*|.gitignore|.github/pull_request_template.md) ;;
              *) app=true ;;
            esac
            case "$file" in
              prisma/*|scripts/*postgres*|src/lib/db.ts|src/lib/db-provider.ts|package.json|package-lock.json|.github/workflows/*) schema=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "Build/browser checks: $app; PostgreSQL rehearsal: $schema" >> "$GITHUB_STEP_SUMMARY"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Check public file boundaries
        run: node scripts/check-public-files.mjs
      - name: Scan complete history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/geez-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          GITLEAKS_BIN="$scanner_dir/gitleaks" node scripts/scan-secrets.mjs
  checks:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Restore verified pose models
        uses: actions/cache@v4
        with:
          path: .cache/pose-models
          key: pose-models-${{ hashFiles('scripts/pose-assets.mjs') }}
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Production dependencies fail on moderate. The dev toolchain (eslint-config-next and its
      # typescript-eslint/minimatch chain) still has moderate advisories, so it stays on high.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
      - run: npm run db:roles:rehearse
      - run: npm run build
      - name: API and browser verification
        shell: pwsh
        run: |
          $geezSquadServer = Start-Process -FilePath node -ArgumentList 'node_modules/next/dist/bin/next','start','--hostname','127.0.0.1' -WindowStyle Hidden -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-WebRequest -Uri http://localhost:3000/api/health -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            node scripts/test-api.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/test-studio-roles.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/test-studio-operations.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/test-coaching-phase.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/test-next-phase.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/test-account-lifecycle.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npx playwright test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npx playwright install webkit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npx playwright test --config playwright.webkit.config.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/check-accessibility.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $geezSquadServer.Id -Force -ErrorAction SilentlyContinue }
      - name: Deferred-email authentication verification
        run: npm run test:email-disabled
      - name: Testing signup and both roles
        run: npm run test:signup
      # Traces record cookies and request bodies. Only on failure: delete storage-state/HAR
      # files, strip each trace's network log and request bodies, redact cookie, token,
      # password and typed values, then upload screenshots and traces with short retention.
      - name: Redact failed browser output
        if: failure()
        run: node scripts/redact-playwright-results.mjs test-results/browser-runs test-results/webkit-runs
      - name: Upload redacted browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser-runs/**/*.png
            test-results/browser-runs/**/trace.zip
            test-results/browser-runs/**/error-context.md
            test-results/webkit-runs/**/*.png
            test-results/webkit-runs/**/trace.zip
            test-results/webkit-runs/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
  # The same API suites as the Windows job, against a production build on Linux with
  # PostgreSQL (the production provider). The database is a throwaway loopback container with
  # a password generated at runtime (scripts/ci-postgres-container.mjs); no repository secret.
  postgres-api:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Restore verified pose models
        uses: actions/cache@v4
        with:
          path: .cache/pose-models
          key: pose-models-${{ hashFiles('scripts/pose-assets.mjs') }}
      - run: npm ci
      - name: Create the local fallback environment file the suites load
        run: node scripts/init-local.mjs
      - name: Migrate, build and run the API suites against PostgreSQL
        run: node scripts/ci-postgres-api.mjs
  postgres-coaching:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Rehearse migrations with a disposable random credential
        run: node scripts/ci-postgres.mjs
