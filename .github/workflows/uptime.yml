name: Uptime
# Calls the deployed /api/health every 15 minutes. A failed run is the alert: GitHub
# emails the user who last changed this schedule (see docs/OPERATIONS.md, "Monitoring
# and alerts"). Set the repository variable UPTIME_URL to the production origin, for
# example https://app.example.com. Without it the job skips cleanly.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        env:
          UPTIME_URL: ${{ vars.UPTIME_URL }}
        run: |
          if [ -z "$UPTIME_URL" ]; then
            echo "::notice::UPTIME_URL repository variable is not set; skipping the uptime check."
            exit 0
          fi
          url="${UPTIME_URL%/}/api/health"
          status=000
          # Three attempts, so one slow cold start or network blip does not page anyone.
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --output body.json --write-out '%{http_code}' \
              --max-time 15 "$url") || true
            status=${status:-000}
            if [ "$status" = "200" ] && grep -q '"status":"ok"' body.json; then
              echo "Health ok (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          # Anonymous callers get only {"status": ...}; no token is needed or sent here.
          echo "::error::/api/health is not ok after 3 attempts (last HTTP $status)."
          head -c 500 body.json 2>/dev/null || true
          exit 1
